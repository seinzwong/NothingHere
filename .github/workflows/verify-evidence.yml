name: Verify published experimental evidence
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  independent-cpu-verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: requirements-verify.txt
      - run: python -m pip install -r requirements-verify.txt
      - run: python verify_evidence.py
      - uses: actions/upload-artifact@v4
        with:
          name: independent-cpu-verification
          path: evidence/independent_verification.json
